# config row, so restate every key when overriding.
- insert:
    - id: mcp-scope
      name: dsh-mcp-scope
      config:
        # Override the server store location. Defaults to $DSH_HOME/mcp-scope.json.
        # storePath: /absolute/path/mcp-scope.json
